[project]
name = "helios-mcp"
version = "0.4.0b1"
description = "Behavioral genome for AI agents with drift detection and profile negotiation"
readme = "README.md"
authors = [
    { name = "Anthony Kougkas", email = "akougkas@iit.edu" }
]
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["mcp", "ai", "configuration", "behavior", "inheritance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Capped below 3 deliberately: fastmcp 3.x and 4.x are separate major
    # rewrites, and 2.12 already provides the tool annotations and output
    # schemas this server publishes. See the SDK note in PLAN.md.
    "fastmcp>=2.12,<3",
    "pyyaml>=6.0.3",
    "gitpython>=3.1.62",
    "click>=8.2",
]

[project.urls]
Homepage = "https://github.com/akougkas/helios-mcp"
Repository = "https://github.com/akougkas/helios-mcp"
Issues = "https://github.com/akougkas/helios-mcp/issues"

[project.scripts]
helios-mcp = "helios_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.0",
    "ruff>=0.16",
    "mypy>=2.3",
    "types-pyyaml>=6.0",
    "hypothesis>=6.168",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helios_mcp"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src"]
# Not source: build output and archived pre-v2 material kept for reference only.
extend-exclude = ["ai-docs", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "A", "C4", "SIM", "ARG"]
ignore = ["ANN401"]

[tool.ruff.lint.flake8-bugbear]
# Field() in a parameter default is how FastMCP tools declare their published
# parameter schema, not a mutable-default bug.
extend-immutable-calls = ["pydantic.Field", "fastmcp.Context"]

[tool.ruff.lint.per-file-ignores]
# Test functions return None by construction and fixtures are injected by name;
# annotating either buys nothing, so the annotation and unused-argument rules
# are relaxed for tests only. E501 is relaxed because the long lines are event
# literals and parametrize tables, where wrapping hurts readability and invites
# transcription errors in the fixtures that guard the behavioral math.
# The library surface in src/ stays strict, line length included.
"tests/**" = ["ANN", "ARG", "E501"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/helios_mcp"]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
